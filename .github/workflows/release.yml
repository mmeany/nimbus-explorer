# Builds and publishes a Windows release when a release_x.y.z branch is created.
# `create` can't be filtered by name, so the build job checks the ref itself. It
# fires once per branch: later pushes to the branch don't start another release.
name: Release

on:
  create:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release_')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check branch name and versions
        id: version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^release_([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Branch '$BRANCH' is not named release_x.y.z"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          npm_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          for found in "$npm_version" "$tauri_version" "$cargo_version"; do
            if [[ "$found" != "$version" ]]; then
              echo "::error::Branch says $version, but package.json=$npm_version, tauri.conf.json=$tauri_version, Cargo.toml=$cargo_version"
              exit 1
            fi
          done

          if [[ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]]; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Audit dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build
        run: npm run tauri build -- --bundles nsis

      # Fixed names without spaces: GitHub would rewrite them in release assets.
      - name: Collect files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp src-tauri/target/release/nimbus-explorer.exe "release/nimbus-explorer_${VERSION}_x64.exe"
          cp "src-tauri/target/release/bundle/nsis/Nimbus Explorer_${VERSION}_x64-setup.exe" "release/nimbus-explorer_${VERSION}_x64-setup.exe"
          (cd release && sha256sum -- *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nimbus-explorer_${{ steps.version.outputs.version }}_windows-x64
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nimbus-explorer_${{ needs.build.outputs.version }}_windows-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "Nimbus Explorer $VERSION" \
            --generate-notes
